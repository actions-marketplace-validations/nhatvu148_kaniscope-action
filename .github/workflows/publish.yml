name: Publish image

# Publishes the action's container to GHCR so consumers pull it instead of
# compiling Rust on every run. action.yml points at :v1, so that floating tag is
# published explicitly here — `type=semver,pattern=v{{major}}` would emit `v0`
# for a v0.1.x release, which is not what action.yml references.
#
# Ordering matters on first adoption: the image must exist at :v1 BEFORE the
# floating v1 git tag moves to a commit whose action.yml references it.
# Pushing a version tag runs this job, so tag first, then move v1.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  publish:
    uses: nhatvu148/shared-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      package-name: kaniscope-action
      # GHCR packages are private by default and action.yml pulls this image
      # anonymously, so a private package breaks every consumer while this job
      # still goes green. Fail the release instead.
      require-public: true
      # Gated on a version tag. workflow_dispatch has no ref guard, so without
      # `enable` a manual run from any branch would move the floating :v1 image
      # tag onto an untagged build - exactly the "tag first, then move v1"
      # ordering this file's header says is required.
      extra-tags: |
        type=raw,value=v1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
